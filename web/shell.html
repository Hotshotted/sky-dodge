<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);
(function () {
  var overlay = document.getElementById('status');
  var fill = document.getElementById('fill');
  var bar = document.getElementById('bar');
  var oops = document.getElementById('oops');
  function fail(err) {
    console.error(err);
    bar.style.display = 'none';
    oops.style.display = 'block';
    oops.textContent = 'The game could not start. Please reload the page.';
    var small = document.createElement('small');
    small.textContent = (err && err.message) ? err.message : (typeof err === 'string' ? err : '');
    if (small.textContent) { oops.appendChild(small); }
  }
  var missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    fail('This browser is missing: ' + missing.join(', '));
    return;
  }
  engine.startGame({
    onProgress: function (current, total) {
      if (current > 0 && total > 0) {
        fill.style.width = Math.max(6, Math.min(100, (current / total) * 100)) + '%';
      }
    }
  }).then(function () {
    fill.style.width = '100%';
    overlay.classList.add('gone');   /* the game's own start-up screen takes over in the same colours */
    setTimeout(function () { overlay.remove(); }, 400);
  }, fail);
}());
</script>
